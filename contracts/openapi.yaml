# Generated from src/contract by `pnpm contract:generate`. Do not edit.
openapi: 3.1.0
info:
  title: IncidentDesk API
  version: 0.1.0
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    Incident:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        severity:
          type: string
          enum:
            - sev1
            - sev2
            - sev3
            - sev4
        status:
          type: string
          enum:
            - open
            - acknowledged
            - resolved
        createdAt:
          type: string
          format: date-time
        acknowledgedAt:
          type:
            - string
            - "null"
          format: date-time
        resolvedAt:
          type:
            - string
            - "null"
          format: date-time
      required:
        - id
        - title
        - severity
        - status
        - createdAt
        - acknowledgedAt
        - resolvedAt
      additionalProperties: false
    Problem:
      type: object
      properties:
        type:
          type: string
          enum:
            - about:blank
        title:
          type: string
        status:
          type: integer
        code:
          type: string
          enum:
            - UNAUTHENTICATED
            - FORBIDDEN
            - NOT_FOUND
            - CONFLICT
            - VALIDATION_FAILED
            - INTERNAL
        detail:
          type: string
        requestId:
          type: string
        errors:
          type: array
          items:
            type: object
            properties:
              path:
                type: string
              message:
                type: string
            required:
              - path
              - message
            additionalProperties: false
      required:
        - type
        - title
        - status
        - code
        - detail
        - requestId
      additionalProperties: false
      description: RFC 9457 problem details
    CreateIncidentRequest:
      type: object
      properties:
        title:
          type: string
          minLength: 3
          maxLength: 200
        severity:
          type: string
          enum:
            - sev1
            - sev2
            - sev3
            - sev4
      required:
        - title
        - severity
      additionalProperties: false
    IncidentList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Incident"
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer
      required:
        - items
        - total
        - limit
        - offset
      additionalProperties: false
    AccessToken:
      type: object
      properties:
        accessToken:
          type: string
        tokenType:
          type: string
          enum:
            - Bearer
        expiresIn:
          type: integer
      required:
        - accessToken
        - tokenType
        - expiresIn
      additionalProperties: false
    SignupRequest:
      type: object
      properties:
        tenantName:
          type: string
          minLength: 1
          maxLength: 100
        email:
          type: string
          maxLength: 254
          format: email
        password:
          type: string
          minLength: 12
          maxLength: 128
      required:
        - tenantName
        - email
        - password
      additionalProperties: false
    LoginRequest:
      type: object
      properties:
        email:
          type: string
          maxLength: 254
          format: email
        password:
          type: string
          minLength: 1
          maxLength: 128
      required:
        - email
        - password
      additionalProperties: false
    SetupPasswordRequest:
      type: object
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 200
        password:
          type: string
          minLength: 12
          maxLength: 128
      required:
        - token
        - password
      additionalProperties: false
    MemberList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Member"
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer
      required:
        - items
        - total
        - limit
        - offset
      additionalProperties: false
    Member:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        role:
          type: string
          enum:
            - viewer
            - responder
            - admin
        status:
          type: string
          enum:
            - pending
            - active
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - email
        - role
        - status
        - createdAt
      additionalProperties: false
    MemberInvite:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        role:
          type: string
          enum:
            - viewer
            - responder
            - admin
        status:
          type: string
          enum:
            - pending
            - active
        createdAt:
          type: string
          format: date-time
        setupToken:
          type: string
        setupTokenExpiresAt:
          type: string
          format: date-time
      required:
        - id
        - email
        - role
        - status
        - createdAt
        - setupToken
        - setupTokenExpiresAt
      additionalProperties: false
      description: The setup token is shown only in this response
    AddMemberRequest:
      type: object
      properties:
        email:
          type: string
          maxLength: 254
          format: email
        role:
          type: string
          enum:
            - viewer
            - responder
            - admin
      required:
        - email
        - role
      additionalProperties: false
  parameters: {}
paths:
  /health:
    get:
      summary: Liveness check
      responses:
        "200":
          description: Service is up
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                      - ok
                required:
                  - status
                additionalProperties: false
  /v1/incidents:
    post:
      summary: Create an incident
      security: &a1
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateIncidentRequest"
      responses:
        "201":
          description: Incident created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Incident"
        "401":
          description: Missing or invalid token
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: Role cannot create incidents
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: Request body failed validation
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
    get:
      summary: List incidents for the caller's tenant
      security: *a1
      parameters:
        - schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
          required: false
          name: limit
          in: query
        - schema:
            type:
              - integer
              - "null"
            minimum: 0
            default: 0
          required: false
          name: offset
          in: query
      responses:
        "200":
          description: A page of incidents
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IncidentList"
        "401":
          description: Missing or invalid token
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: Query failed validation
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/incidents/{id}:
    get:
      summary: Get one incident
      security: *a1
      parameters:
        - schema:
            type: string
            format: uuid
          required: true
          name: id
          in: path
      responses:
        "200":
          description: The incident
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Incident"
        "401":
          description: Missing or invalid token
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: No such incident in this tenant
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: Id is not a UUID
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/incidents/{id}/acknowledge:
    post:
      summary: Acknowledge an open incident
      security: *a1
      parameters:
        - schema:
            type: string
            format: uuid
          required: true
          name: id
          in: path
      responses:
        "200":
          description: The acknowledged incident
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Incident"
        "401":
          description: Missing or invalid token
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: Role cannot acknowledge incidents
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: No such incident in this tenant
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: Incident is not open
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: Id is not a UUID
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/incidents/{id}/resolve:
    post:
      summary: Resolve an open or acknowledged incident
      security: *a1
      parameters:
        - schema:
            type: string
            format: uuid
          required: true
          name: id
          in: path
      responses:
        "200":
          description: The resolved incident
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Incident"
        "401":
          description: Missing or invalid token
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: Role cannot resolve incidents
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: No such incident in this tenant
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: Incident is already resolved, or changed while resolving
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: Id is not a UUID
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/auth/signup:
    post:
      summary: Create a tenant with the caller as its admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignupRequest"
      responses:
        "201":
          description: An access token for the API
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessToken"
        "409":
          description: Email is already registered
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: Request body failed validation
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/auth/login:
    post:
      summary: Exchange email and password for a token
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: An access token for the API
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessToken"
        "401":
          description: Email or password is incorrect
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: Request body failed validation
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/auth/setup-password:
    post:
      summary: Set a new member's password with a setup token
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetupPasswordRequest"
      responses:
        "200":
          description: An access token for the API
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessToken"
        "401":
          description: Setup token is invalid, used or expired
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: Request body failed validation
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/members:
    get:
      summary: List members of the caller's tenant
      security: *a1
      parameters:
        - schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
          required: false
          name: limit
          in: query
        - schema:
            type:
              - integer
              - "null"
            minimum: 0
            default: 0
          required: false
          name: offset
          in: query
      responses:
        "200":
          description: A page of members
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberList"
        "401":
          description: Missing or invalid token
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: Only admins can list members
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: Query failed validation
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
    post:
      summary: Add a member to the caller's tenant
      security: *a1
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddMemberRequest"
      responses:
        "201":
          description: Member added, pending until they set a password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberInvite"
        "401":
          description: Missing or invalid token
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: Only admins can add members
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: Email is already registered
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: Request body failed validation
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
webhooks: {}
