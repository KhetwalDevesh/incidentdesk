        - total
        - limit
        - offset
      additionalProperties: false
    UpdateOnCallScheduleRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        timeZone:
          type: string
          maxLength: 64
        handoffTime:
          type: string
          pattern: ^([01]\d|2[0-3]):[0-5]\d$
        rotationDays:
          type: integer
          minimum: 1
          maximum: 28
        startsOn:
          type: string
          format: date
        participants:
          type: array
          items:
            type: string
            format: uuid
          maxItems: 50
        isDefault:
          type: boolean
      additionalProperties: false
      description: Any subset. A participants list replaces the whole rotation.
    OnCall:
      type: object
      properties:
        at:
          type: string
          format: date-time
        onCall:
          type:
            - object
            - "null"
          properties:
            userId:
              type: string
              format: uuid
            email:
              type: string
            source:
              type: string
              enum:
                - rotation
                - override
            from:
              type: string
              format: date-time
            until:
              type: string
              format: date-time
          required:
            - userId
            - email
            - source
            - from
            - until
          additionalProperties: false
      required:
        - at
        - onCall
      additionalProperties: false
      description: Who is on call at a time. Null when nobody is.
    OnCallOverride:
      type: object
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        email:
          type: string
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
        createdBy:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - userId
        - email
        - startsAt
        - endsAt
        - createdBy
        - createdAt
      additionalProperties: false
    CreateOnCallOverrideRequest:
      type: object
      properties:
        userId:
          type: string
          format: uuid
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
      required:
        - userId
        - startsAt
        - endsAt
      additionalProperties: false
    OnCallOverrideList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/OnCallOverride"
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer
      required:
        - items
        - total
        - limit
        - offset
      additionalProperties: false
    AlertList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Alert"
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer
        state:
          type: string
          enum:
            - pending
            - processed
            - failed
      required:
        - items
        - total
        - limit
        - offset
      additionalProperties: false
    Alert:
      type: object
      properties:
        id:
          type: string
          format: uuid
        sourceId:
          type: string
          format: uuid
        dedupKey:
          type: string
        status:
          type: string
          enum:
            - firing
            - resolved
        title:
          type: string
        severity:
          type: string
          enum:
            - sev1
            - sev2
            - sev3
            - sev4
        details:
          type: object
          additionalProperties:
            anyOf:
              - type: string
                maxLength: 1000
              - type: number
              - type: boolean
        state:
          type: string
          enum:
            - pending
            - processed
            - failed
        attempts:
          type: integer
        incidentId:
          type:
            - string
            - "null"
          format: uuid
        receivedAt:
          type: string
          format: date-time
        processedAt:
          type:
            - string
            - "null"
          format: date-time
      required:
        - id
        - sourceId
        - dedupKey
        - status
        - title
        - severity
        - details
        - state
        - attempts
        - incidentId
        - receivedAt
        - processedAt
      additionalProperties: false
    AlertAccepted:
      type: object
      properties:
        alertId:
          type: string
          format: uuid
      required:
        - alertId
      additionalProperties: false
    AlertPayload:
      type: object
      properties:
        dedupKey:
          type: string
          minLength: 1
          maxLength: 200
        title:
          type: string
          minLength: 3
          maxLength: 200
        severity:
          type: string
          enum:
            - sev1
            - sev2
            - sev3
            - sev4
        status:
          type: string
          enum:
            - firing
            - resolved
          default: firing
        details:
          type: object
          additionalProperties:
            anyOf:
              - type: string
                maxLength: 1000
              - type: number
              - type: boolean
      required:
        - dedupKey
        - title
        - severity
      additionalProperties: false
  parameters: {}
paths:
  /health:
    get:
      summary: Liveness check
      responses:
        "200":
          description: Service is up
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                      - ok
                required:
                  - status
                additionalProperties: false
  /v1/incidents:
    post:
      summary: Create an incident
      security: &a1
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateIncidentRequest"
      responses:
        "201":
          description: Incident created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Incident"
        "401":
          description: Missing or invalid token
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: Role cannot create incidents
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: Request body failed validation
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
    get:
      summary: List incidents for the caller's tenant
      security: *a1
      parameters:
        - schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
          required: false
          name: limit
          in: query
        - schema:
            type:
              - integer
              - "null"
            minimum: 0
            default: 0
          required: false
          name: offset
          in: query
      responses:
        "200":
          description: A page of incidents
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IncidentList"
        "401":
          description: Missing or invalid token
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: Query failed validation
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/incidents/{id}:
    get:
      summary: Get one incident
      security: *a1
      parameters:
        - schema:
            type: string
            format: uuid
          required: true
          name: id
          in: path
      responses:
        "200":
          description: The incident
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Incident"
        "401":
          description: Missing or invalid token
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: No such incident in this tenant
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: Id is not a UUID
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/incidents/{id}/acknowledge:
    post:
      summary: Acknowledge an open incident
      security: *a1
      parameters:
        - schema:
            type: string
            format: uuid
          required: true
          name: id
          in: path
      responses:
        "200":
          description: The acknowledged incident
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Incident"
        "401":
          description: Missing or invalid token
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: The incident is assigned to someone else, and the caller is not an
            admin
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: No such incident in this tenant
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: Incident is not open
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: Id is not a UUID
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/incidents/{id}/resolve:
    post:
      summary: Resolve an open or acknowledged incident
      security: *a1
      parameters:
        - schema:
            type: string
            format: uuid
          required: true
          name: id
          in: path
      responses:
        "200":
          description: The resolved incident
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Incident"
        "401":
          description: Missing or invalid token
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: The incident is assigned to someone else, and the caller is not an
            admin
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: No such incident in this tenant
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: Incident is already resolved, or changed while resolving
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: Id is not a UUID
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/incidents/{id}/assign:
    post:
      summary: Reassign an unresolved incident to a member, or unassign it
      description: Any member may reassign to any member of the tenant, themself
        included. Only an admin may unassign (null). Assigning the current
        assignee changes nothing.
      security: *a1
      parameters:
        - schema:
            type: string
            format: uuid
          required: true
          name: id
          in: path
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssignIncidentRequest"
      responses:
        "200":
          description: The incident with its new assignee
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Incident"
        "401":
          description: Missing or invalid token
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: Only an admin can unassign an incident
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: No such incident or member in this tenant
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: Incident is resolved, or changed while reassigning
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: Id or body failed validation
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/incidents/{id}/summary-drafts:
    post:
      summary: Ask the AI for a fresh summary draft
      description: Returns the incident's pending draft if it has one. The draft is
        written in the background, and stays a suggestion until a member accepts
        it. Over the tenant's daily cap, the draft comes back skipped.
      security: *a1
      parameters:
        - schema:
            type: string
            format: uuid
          required: true
          name: id
          in: path
      responses:
        "202":
          description: The queued, pending or skipped draft
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SummaryDraft"
        "401":
          description: Missing or invalid token
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: No such incident in this tenant
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: Id is not a UUID
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
    get:
      summary: List an incident's summary drafts, newest first
      security: *a1
      parameters:
        - schema:
            type: string
            format: uuid
          required: true
          name: id
          in: path
        - schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
          required: false
          name: limit
          in: query
        - schema:
            type:
              - integer
              - "null"
            minimum: 0
            default: 0
          required: false
          name: offset
          in: query
      responses:
        "200":
          description: A page of drafts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SummaryDraftList"
        "401":
          description: Missing or invalid token
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: No such incident in this tenant
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: Id or query failed validation
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/incidents/{id}/summary:
    put:
      summary: Set an incident's summary, and optionally its severity
      description: Any member may write the summary by hand or accept a ready draft
        (draftId), editing it first if they like. A severity change is refused
        on a resolved incident.
      security: *a1
      parameters:
        - schema:
            type: string
            format: uuid
          required: true
          name: id
          in: path
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetSummaryRequest"
      responses:
        "200":
          description: The incident with its summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Incident"
        "401":
          description: Missing or invalid token
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: No such incident, or draftId is not a ready draft of it
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: Severity change on a resolved incident, or the incident changed
            meanwhile
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: Id or body failed validation
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/incidents/{id}/postmortem-drafts:
    post:
      summary: Ask the AI for a fresh postmortem draft of a resolved incident
      description: Returns the pending draft if there is one. Written in the
        background, and only a suggestion until a member saves it. Over the
        tenant's daily AI cap, shared with summary drafts, the draft comes back
        skipped.
      security: *a1
      parameters:
        - schema:
            type: string
            format: uuid
          required: true
          name: id
          in: path
      responses:
        "202":
          description: The queued, pending or skipped draft
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PostmortemDraft"
        "401":
          description: Missing or invalid token
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: No such incident in this tenant
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: The incident is not resolved
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: Id is not a UUID
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
    get:
      summary: List an incident's postmortem drafts, newest first
      security: *a1
      parameters:
        - schema:
            type: string
            format: uuid
          required: true
          name: id
          in: path
        - schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
          required: false
          name: limit
          in: query
        - schema:
            type:
              - integer
              - "null"
            minimum: 0
            default: 0
          required: false
          name: offset
          in: query
      responses:
        "200":
          description: A page of drafts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PostmortemDraftList"
        "401":
          description: Missing or invalid token
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: No such incident in this tenant
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: Id or query failed validation
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/incidents/{id}/postmortem:
    get:
      summary: Get an incident's postmortem
      security: *a1
      parameters:
        - schema:
            type: string
            format: uuid
          required: true
          name: id
          in: path
      responses:
        "200":
          description: The postmortem
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Postmortem"
        "401":
          description: Missing or invalid token
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: No such incident in this tenant, or no postmortem yet
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: Id is not a UUID
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
    put:
      summary: Save a resolved incident's postmortem, by hand or from a draft
      description: Any member may save. With only draftId, the body is the draft
        rendered as Markdown. A published postmortem stays published.
      security: *a1
      parameters:
        - schema:
            type: string
            format: uuid
          required: true
          name: id
          in: path
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SavePostmortemRequest"
      responses:
        "200":
          description: The saved postmortem
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Postmortem"
        "401":
          description: Missing or invalid token
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: No such incident, or draftId is not a ready draft of it
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: The incident is not resolved
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: Id or body failed validation
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/incidents/{id}/postmortem/publish:
    post:
      summary: Publish an incident's postmortem
      description: Any member may publish. Publishing again changes nothing.
      security: *a1
      parameters:
        - schema:
            type: string
            format: uuid
          required: true
          name: id
          in: path
      responses:
        "200":
          description: The published postmortem
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Postmortem"
        "401":
          description: Missing or invalid token
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: No such incident in this tenant, or no postmortem yet
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: Id is not a UUID
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/incidents/{id}/events:
    get:
      summary: An incident's audit timeline, oldest first
      security: *a1
      parameters:
        - schema:
            type: string
            format: uuid
          required: true
          name: id
          in: path
        - schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
          required: false
          name: limit
          in: query
        - schema:
            type:
              - integer
              - "null"
            minimum: 0
            default: 0
          required: false
          name: offset
          in: query
      responses:
        "200":
          description: A page of the incident's audit events
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditEventList"
        "401":
          description: Missing or invalid token
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: No such incident in this tenant
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: Id or query failed validation
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/audit-events:
    get:
      summary: List the caller's tenant's audit events, newest first
      description: Every role may read the whole log. Entries are append-only and kept
        for 90 days.
      security: *a1
      parameters:
        - schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
          required: false
          name: limit
          in: query
        - schema:
            type:
              - integer
              - "null"
            minimum: 0
            default: 0
          required: false
          name: offset
          in: query
        - schema:
            type: string
            enum:
              - tenant.created
              - member.invited
              - member.setup_completed
              - member.role_changed
              - member.removed
              - user.login_succeeded
              - user.login_failed
              - user.login_locked
              - incident.created
              - incident.acknowledged
              - incident.resolved
              - incident.assigned
              - incident.summary_set
              - incident.severity_changed
              - postmortem.saved
              - postmortem.published
              - alert.grouped
              - alert_source.created
              - alert_source.updated
              - notification_channel.created
              - on_call_schedule.created
              - on_call_schedule.updated
              - on_call_schedule.deleted
              - on_call_override.created
              - on_call_override.deleted
          required: false
          name: action
          in: query
        - schema:
            type: string
            enum:
              - tenant
              - user
              - incident
              - alert_source
              - notification_channel
              - on_call_schedule
          required: false
          name: resourceType
          in: query
        - schema:
            type: string
            minLength: 1
            maxLength: 100
          required: false
          name: resourceId
          in: query
        - schema:
            type: string
            minLength: 1
            maxLength: 100
          required: false
          name: actorId
          in: query
        - schema:
            type: string
            format: date-time
          required: false
          name: from
          in: query
        - schema:
            type: string
            format: date-time
          required: false
          name: to
          in: query
      responses:
        "200":
          description: A page of audit events
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditEventList"
        "401":
          description: Missing or invalid token
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: Query failed validation
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/auth/signup:
    post:
      summary: Create a tenant with the caller as its admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignupRequest"
      responses:
        "201":
          description: An access token for the API
