                - acknowledged
              additionalProperties: false
            sev2:
              type: object
              properties:
                open:
                  type: integer
                acknowledged:
                  type: integer
              required:
                - open
                - acknowledged
              additionalProperties: false
            sev3:
              type: object
              properties:
                open:
                  type: integer
                acknowledged:
                  type: integer
              required:
                - open
                - acknowledged
              additionalProperties: false
            sev4:
              type: object
              properties:
