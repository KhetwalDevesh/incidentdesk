              open:
                type: integer
              acknowledged:
                type: integer
              total:
                type: integer
            required:
              - userId
              - email
              - open
              - acknowledged
              - total
            additionalProperties: false
        assigneeCount:
          type: integer
      required:
        - generatedAt
        - window
        - totals
        - bySeverity
        - load
        - assigneeCount
      additionalProperties: false
      description: Unresolved incidents, read now, optionally narrowed to those opened
