  /v1/events:
    get:
      summary: A live stream of the tenant's changes, as Server-Sent Events
      description: "Authenticate with the Authorization header, so read the stream
        with fetch, not EventSource. Events: ready and resync (data {}): fetch
        current state now; incident.opened, incident.acknowledged,
        incident.resolved and incident.reassigned ({ incident: Incident });
        dashboard (Dashboard, no window), at most once a second;
        on_call_schedule.created and on_call_schedule.updated ({ schedule:
        OnCallSchedule }); on_call_schedule.deleted ({ id });
        on_call_override.created ({ scheduleId, override: OnCallOverride });
        on_call_override.deleted ({ scheduleId, id }). incident.updated ({
        incident }) when its summary or severity changes; summary_draft.ready ({
        incidentId, draft: SummaryDraft }) when a draft finishes;
        postmortem_draft.ready ({ incidentId, draft: PostmortemDraft }) when a
        postmortem draft finishes; postmortem.updated ({ postmortem: Postmortem
        }) when a postmortem is saved or published. The stream closes when the
        token expires or the member is removed. There is no replay. Spec:
        docs/features/realtime-status.md."
      security: *a1
      responses:
        "200":
          description: An open event stream
          content:
            text/event-stream:
              schema:
                type: string
        "401":
          description: Missing or invalid token
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
