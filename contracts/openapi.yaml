  /webhooks/alerts/{sourceId}:
    post:
      summary: Accept a signed alert from a monitoring tool
      description: The signature is checked before the body is parsed. The alert is
        queued, and a worker groups it into an incident.
      parameters:
        - schema:
            type: string
            format: uuid
          required: true
          name: sourceId
          in: path
        - schema:
            type: string
            description: Unix time in seconds
          required: true
          description: Unix time in seconds
          name: X-IncidentDesk-Timestamp
          in: header
        - schema:
            type: string
            description: v1= followed by the hex HMAC-SHA256 of `{timestamp}.{raw body}`
          required: true
          description: v1= followed by the hex HMAC-SHA256 of `{timestamp}.{raw body}`
          name: X-IncidentDesk-Signature
          in: header
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AlertPayload"
      responses:
        "202":
          description: Alert queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlertAccepted"
        "401":
          description: Unknown source, stale timestamp, or missing or invalid signature
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "413":
          description: Body is larger than 64 KB
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: Body failed validation
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
webhooks: {}
