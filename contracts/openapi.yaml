# Generated from src/contract by `pnpm contract:generate`. Do not edit.
openapi: 3.1.0
info:
  title: IncidentDesk API
  version: 0.1.0
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    Incident:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        severity:
          type: string
          enum:
            - sev1
            - sev2
            - sev3
            - sev4
        status:
          type: string
          enum:
            - open
            - acknowledged
            - resolved
        createdAt:
          type: string
          format: date-time
        acknowledgedAt:
          type:
            - string
            - "null"
          format: date-time
        resolvedAt:
          type:
            - string
            - "null"
          format: date-time
        origin:
          type: string
          enum:
            - manual
            - alert
        alertCount:
          type: integer
        lastAlertAt:
          type:
            - string
            - "null"
          format: date-time
      required:
        - id
        - title
        - severity
        - status
        - createdAt
        - acknowledgedAt
        - resolvedAt
        - origin
        - alertCount
        - lastAlertAt
      additionalProperties: false
    Problem:
      type: object
      properties:
        type:
          type: string
          enum:
            - about:blank
        title:
          type: string
        status:
          type: integer
        code:
          type: string
          enum:
            - UNAUTHENTICATED
            - FORBIDDEN
            - NOT_FOUND
            - CONFLICT
            - PAYLOAD_TOO_LARGE
            - VALIDATION_FAILED
            - INTERNAL
        detail:
          type: string
        requestId:
          type: string
        errors:
          type: array
          items:
            type: object
            properties:
              path:
                type: string
              message:
                type: string
            required:
              - path
              - message
            additionalProperties: false
      required:
        - type
        - title
        - status
        - code
        - detail
        - requestId
      additionalProperties: false
      description: RFC 9457 problem details
    CreateIncidentRequest:
      type: object
      properties:
        title:
          type: string
          minLength: 3
          maxLength: 200
        severity:
          type: string
          enum:
            - sev1
            - sev2
            - sev3
            - sev4
      required:
        - title
        - severity
      additionalProperties: false
    IncidentList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Incident"
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer
      required:
        - items
        - total
        - limit
        - offset
      additionalProperties: false
    AuditEventList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AuditEvent"
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer
      required:
        - items
        - total
        - limit
        - offset
      additionalProperties: false
    AuditEvent:
      type: object
      properties:
        id:
          type: string
          format: uuid
        occurredAt:
          type: string
          format: date-time
        action:
          type: string
          enum:
            - tenant.created
            - member.invited
            - member.setup_completed
            - member.role_changed
            - member.removed
            - user.login_succeeded
            - user.login_failed
            - incident.created
            - incident.acknowledged
            - incident.resolved
            - alert.grouped
            - alert_source.created
            - notification_channel.created
        actor:
          type: object
          properties:
            type:
              type: string
              enum:
                - user
                - alert_source
                - anonymous
            id:
              type:
                - string
                - "null"
          required:
            - type
            - id
          additionalProperties: false
        resource:
          type: object
          properties:
            type:
              type: string
              enum:
                - tenant
                - user
                - incident
                - alert_source
                - notification_channel
            id:
              type: string
          required:
            - type
            - id
          additionalProperties: false
        details:
          type: object
          additionalProperties:
            type: string
        requestId:
          type:
            - string
            - "null"
      required:
        - id
        - occurredAt
        - action
        - actor
        - resource
        - details
        - requestId
      additionalProperties: false
    AccessToken:
      type: object
      properties:
        accessToken:
          type: string
        tokenType:
          type: string
          enum:
            - Bearer
        expiresIn:
          type: integer
      required:
        - accessToken
        - tokenType
        - expiresIn
      additionalProperties: false
    SignupRequest:
      type: object
      properties:
        tenantName:
          type: string
          minLength: 1
          maxLength: 100
        email:
          type: string
          maxLength: 254
          format: email
        password:
          type: string
          minLength: 12
          maxLength: 128
      required:
        - tenantName
        - email
        - password
      additionalProperties: false
    LoginRequest:
      type: object
      properties:
        email:
          type: string
          maxLength: 254
          format: email
        password:
          type: string
          minLength: 1
          maxLength: 128
      required:
        - email
        - password
      additionalProperties: false
    SetupPasswordRequest:
      type: object
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 200
        password:
          type: string
          minLength: 12
          maxLength: 128
      required:
        - token
        - password
      additionalProperties: false
    MemberList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Member"
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer
      required:
        - items
        - total
        - limit
        - offset
      additionalProperties: false
    Member:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        role:
          type: string
          enum:
            - viewer
            - responder
            - admin
        status:
          type: string
          enum:
            - pending
            - active
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - email
        - role
        - status
        - createdAt
      additionalProperties: false
    MemberInvite:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        role:
          type: string
          enum:
            - viewer
            - responder
            - admin
        status:
          type: string
          enum:
            - pending
            - active
        createdAt:
          type: string
          format: date-time
        setupToken:
          type: string
        setupTokenExpiresAt:
          type: string
          format: date-time
      required:
        - id
        - email
        - role
        - status
        - createdAt
        - setupToken
        - setupTokenExpiresAt
      additionalProperties: false
      description: The setup token is shown only in this response
    AddMemberRequest:
      type: object
      properties:
        email:
          type: string
          maxLength: 254
          format: email
        role:
          type: string
          enum:
            - viewer
            - responder
            - admin
      required:
        - email
        - role
      additionalProperties: false
    UpdateMemberRequest:
      type: object
      properties:
        role:
          type: string
          enum:
            - viewer
            - responder
            - admin
      required:
        - role
      additionalProperties: false
    MemberBatch:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Member"
      required:
        - items
      additionalProperties: false
      description: The members after the change, in request order
    BulkUpdateMembersRequest:
      type: object
      properties:
        changes:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
              role:
                type: string
                enum:
                  - viewer
                  - responder
                  - admin
            required:
              - id
              - role
            additionalProperties: false
          minItems: 1
          maxItems: 50
      required:
        - changes
      additionalProperties: false
      description: "All or nothing: if any change fails, none is applied"
    BulkRemoveMembersRequest:
      type: object
      properties:
        ids:
          type: array
          items:
            type: string
            format: uuid
          minItems: 1
          maxItems: 50
      required:
        - ids
      additionalProperties: false
      description: "All or nothing: if any removal fails, none is applied"
    NotificationChannelList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/NotificationChannel"
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer
      required:
        - items
        - total
        - limit
        - offset
      additionalProperties: false
    NotificationChannel:
      type: object
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
          enum:
            - slack_webhook
        name:
          type: string
        webhookUrlHint:
          type: string
        minSeverity:
          type: string
          enum:
            - sev1
            - sev2
            - sev3
            - sev4
        enabled:
          type: boolean
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - kind
        - name
        - webhookUrlHint
        - minSeverity
        - enabled
        - createdAt
      additionalProperties: false
      description: The webhook URL is never returned. webhookUrlHint shows its last 4
        characters.
    CreateNotificationChannelRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        webhookUrl:
          type: string
          maxLength: 2048
          format: uri
        minSeverity:
          type: string
          enum:
            - sev1
            - sev2
            - sev3
            - sev4
          default: sev4
        enabled:
          type: boolean
          default: true
      required:
        - name
        - webhookUrl
      additionalProperties: false
    AlertSourceList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AlertSource"
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer
      required:
        - items
        - total
        - limit
        - offset
      additionalProperties: false
    AlertSource:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        secretHint:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - secretHint
        - createdAt
      additionalProperties: false
      description: The signing secret is never returned. secretHint shows its last 4
        characters.
    CreatedAlertSource:
      allOf:
        - $ref: "#/components/schemas/AlertSource"
        - type: object
          properties:
            secret:
              type: string
          required:
            - secret
          additionalProperties: false
      description: "Returned once, on create. Store the secret now: it is never shown
        again."
    CreateAlertSourceRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
      required:
        - name
      additionalProperties: false
    AlertList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Alert"
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer
        state:
          type: string
          enum:
            - pending
            - processed
            - failed
      required:
        - items
        - total
        - limit
        - offset
      additionalProperties: false
    Alert:
      type: object
      properties:
        id:
          type: string
          format: uuid
        sourceId:
          type: string
          format: uuid
        dedupKey:
          type: string
        status:
          type: string
          enum:
            - firing
            - resolved
        title:
          type: string
        severity:
          type: string
          enum:
            - sev1
            - sev2
            - sev3
            - sev4
        details:
          type: object
          additionalProperties:
            anyOf:
              - type: string
                maxLength: 1000
              - type: number
              - type: boolean
        state:
          type: string
          enum:
            - pending
            - processed
            - failed
        attempts:
          type: integer
        incidentId:
          type:
            - string
            - "null"
          format: uuid
        receivedAt:
          type: string
          format: date-time
        processedAt:
          type:
            - string
            - "null"
          format: date-time
      required:
        - id
        - sourceId
        - dedupKey
        - status
        - title
        - severity
        - details
        - state
        - attempts
        - incidentId
        - receivedAt
        - processedAt
      additionalProperties: false
    AlertAccepted:
      type: object
      properties:
        alertId:
          type: string
          format: uuid
      required:
        - alertId
      additionalProperties: false
    AlertPayload:
      type: object
      properties:
        dedupKey:
          type: string
          minLength: 1
          maxLength: 200
        title:
          type: string
          minLength: 3
          maxLength: 200
        severity:
          type: string
          enum:
            - sev1
            - sev2
            - sev3
            - sev4
        status:
          type: string
          enum:
            - firing
            - resolved
          default: firing
        details:
          type: object
          additionalProperties:
            anyOf:
              - type: string
                maxLength: 1000
              - type: number
              - type: boolean
      required:
        - dedupKey
        - title
        - severity
      additionalProperties: false
  parameters: {}
paths:
  /health:
    get:
      summary: Liveness check
      responses:
        "200":
          description: Service is up
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                      - ok
                required:
                  - status
                additionalProperties: false
  /v1/incidents:
    post:
      summary: Create an incident
      security: &a1
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateIncidentRequest"
      responses:
        "201":
          description: Incident created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Incident"
        "401":
          description: Missing or invalid token
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: Role cannot create incidents
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: Request body failed validation
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
    get:
      summary: List incidents for the caller's tenant
      security: *a1
      parameters:
        - schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
          required: false
          name: limit
          in: query
        - schema:
            type:
              - integer
              - "null"
            minimum: 0
            default: 0
          required: false
          name: offset
          in: query
      responses:
        "200":
          description: A page of incidents
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IncidentList"
        "401":
          description: Missing or invalid token
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: Query failed validation
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/incidents/{id}:
    get:
      summary: Get one incident
      security: *a1
      parameters:
        - schema:
            type: string
            format: uuid
          required: true
          name: id
          in: path
      responses:
        "200":
          description: The incident
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Incident"
        "401":
          description: Missing or invalid token
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: No such incident in this tenant
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: Id is not a UUID
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/incidents/{id}/acknowledge:
    post:
      summary: Acknowledge an open incident
      security: *a1
      parameters:
        - schema:
            type: string
            format: uuid
          required: true
          name: id
          in: path
      responses:
        "200":
          description: The acknowledged incident
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Incident"
        "401":
          description: Missing or invalid token
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: Role cannot acknowledge incidents
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: No such incident in this tenant
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: Incident is not open
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: Id is not a UUID
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/incidents/{id}/resolve:
    post:
      summary: Resolve an open or acknowledged incident
      security: *a1
      parameters:
        - schema:
            type: string
            format: uuid
          required: true
          name: id
          in: path
      responses:
        "200":
          description: The resolved incident
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Incident"
        "401":
          description: Missing or invalid token
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: Role cannot resolve incidents
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: No such incident in this tenant
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: Incident is already resolved, or changed while resolving
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: Id is not a UUID
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/incidents/{id}/events:
    get:
      summary: An incident's audit timeline, oldest first
      security: *a1
      parameters:
        - schema:
            type: string
            format: uuid
          required: true
          name: id
          in: path
        - schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
          required: false
          name: limit
          in: query
        - schema:
            type:
              - integer
              - "null"
            minimum: 0
            default: 0
          required: false
          name: offset
          in: query
      responses:
        "200":
          description: A page of the incident's audit events
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditEventList"
        "401":
          description: Missing or invalid token
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: No such incident in this tenant
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: Id or query failed validation
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/audit-events:
    get:
      summary: List the caller's tenant's audit events, newest first
      description: Every role may read the whole log. Entries are append-only and kept
        for 90 days.
      security: *a1
      parameters:
        - schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
          required: false
          name: limit
          in: query
        - schema:
            type:
              - integer
              - "null"
            minimum: 0
            default: 0
          required: false
          name: offset
          in: query
        - schema:
            type: string
            enum:
              - tenant.created
              - member.invited
              - member.setup_completed
              - member.role_changed
              - member.removed
              - user.login_succeeded
              - user.login_failed
              - incident.created
              - incident.acknowledged
              - incident.resolved
              - alert.grouped
              - alert_source.created
              - notification_channel.created
          required: false
          name: action
          in: query
        - schema:
            type: string
            enum:
              - tenant
              - user
              - incident
              - alert_source
              - notification_channel
          required: false
          name: resourceType
          in: query
        - schema:
            type: string
            minLength: 1
            maxLength: 100
          required: false
          name: resourceId
          in: query
        - schema:
            type: string
            minLength: 1
            maxLength: 100
          required: false
          name: actorId
          in: query
        - schema:
            type: string
            format: date-time
          required: false
          name: from
          in: query
        - schema:
            type: string
            format: date-time
          required: false
          name: to
          in: query
      responses:
        "200":
          description: A page of audit events
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditEventList"
        "401":
          description: Missing or invalid token
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: Query failed validation
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/auth/signup:
    post:
      summary: Create a tenant with the caller as its admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignupRequest"
      responses:
        "201":
          description: An access token for the API
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessToken"
        "409":
          description: Email is already registered
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: Request body failed validation
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/auth/login:
    post:
      summary: Exchange email and password for a token
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: An access token for the API
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessToken"
        "401":
          description: Email or password is incorrect
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: Request body failed validation
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/auth/setup-password:
    post:
      summary: Set a new member's password with a setup token
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetupPasswordRequest"
      responses:
        "200":
          description: An access token for the API
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessToken"
        "401":
          description: Setup token is invalid, used or expired
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: Request body failed validation
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/members:
    get:
      summary: List members of the caller's tenant
      security: *a1
      parameters:
