# Local development database. Credentials here are for development only.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: incidentdesk
      POSTGRES_PASSWORD: incidentdesk
      POSTGRES_DB: incidentdesk
    ports:
      - "54329:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U incidentdesk -d incidentdesk"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  postgres-data:
